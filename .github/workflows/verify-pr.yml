name: verify-pr

# Native verification for submissions. Every claimed solution in the PR is
# re-run on the native VM; the check fails if any claim does not pass.

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Tests
        run: cargo test
      - name: Re-verify every claimed solution (native VM, 5 epochs)
        run: cargo run --release -p harness -- verify-leaderboard --epochs 5
