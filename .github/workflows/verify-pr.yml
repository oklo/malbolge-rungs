name: verify-pr

# Native verification for submissions. Every claimed solution in the PR is
# re-run on the native VM; the check fails if any claim does not pass.
#
# A submission PR must touch ONLY data files (the candidate program, its
# leaderboard record, and attempt reports). This guard runs before anything is
# built or executed, so a PR that alters the evaluator, registry, tests,
# tooling, or the workflow itself gets a red check *without its modified code
# ever running* — closing the "a PR modifies the judge that certifies it" hole.
# Evaluator/registry changes are maintainer work and go through a different
# path, not this auto-verification.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Restrict submission PRs to data files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Changed files:"; echo "$changed"
          # Allowlist: solution programs, leaderboard records, attempt records/reports,
          # and the builder/search code those records cite under research/.
          bad="$(echo "$changed" | grep -vE '^(solutions/|docs/attempts/|research/|leaderboard/leaderboard\.json$)' || true)"
          if [ -n "$bad" ]; then
            echo "::error::This PR changes files outside the submission allowlist:"
            echo "$bad" | sed 's/^/::error::  /'
            echo "::error::Submission PRs may touch only solutions/**, docs/attempts/**, research/**, and leaderboard/leaderboard.json."
            echo "::error::Changes to the evaluator, registry, tests, tooling, or workflows must be reviewed as code — this job will not auto-verify them."
            exit 1
          fi
      - name: Reject symlinks and submodules anywhere in the PR tree
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Submission data is plain files. A committed symlink passes the path
        # allowlist yet redirects later reads and writes (the no-auth admission
        # worker writes with symlink refusal, but the tree must not carry the
        # bait in the first place), and a submodule smuggles an unreviewed
        # external tree. Mode 120000 is a symlink, 160000 a gitlink.
        # Fail CLOSED: if the tree cannot be listed (GC'd head after a
        # force-push race, a shallow fetch), the step fails rather than
        # passing green having scanned nothing.
        run: |
          if ! tree="$(git ls-tree -r "$HEAD")"; then
            echo "::error::git ls-tree $HEAD failed — refusing to pass an unscanned tree"
            exit 1
          fi
          bad="$(printf '%s\n' "$tree" | awk '$1 == "120000" || $1 == "160000"')"
          if [ -n "$bad" ]; then
            echo "::error::The PR tree contains symlink or submodule entries:"
            echo "$bad" | sed 's/^/::error::  /'
            exit 1
          fi

  verify:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Tests
        run: cargo test
      # The CLI raises the count to each rung's own required_epochs, so 5 is a
      # floor for seed-dependent rungs, never a ceiling on stricter ones.
      - name: Re-verify every claimed solution (native VM, at least each rung's declared epochs)
        run: cargo run --release -p harness -- verify-leaderboard --epochs 5
