name: leaderboard-site

# Deploys the static leaderboard to GitHub Pages. The site generator re-runs
# every claimed solution on the native VM and refuses to render if any claim
# fails, so the published page is always verification-backed.
#
# Build and deploy are separate jobs on purpose: the job that compiles and
# runs repository code holds only contents:read, so nothing that executes
# during a build — tests, the generator, anything a future dependency pulls
# in — ever runs with pages:write or an OIDC token. Only the deploy job, which
# executes no repository code, can publish.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run tests (includes leaderboard re-verification)
        run: cargo test
      - name: Generate site (re-verifies every solved rung natively)
        run: cargo run --release -p harness -- site --out _site --epochs 3
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
