name: leaderboard-site

# Deploys the static leaderboard to GitHub Pages. The site generator re-runs
# every claimed solution on the native VM and refuses to render if any claim
# fails, so the published page is always verification-backed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests (includes leaderboard re-verification)
        run: cargo test
      - name: Generate site (re-verifies every solved rung natively)
        run: cargo run --release -p harness -- site --out _site --epochs 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
